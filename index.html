<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyStore | Online Shopping in Pakistan</title>
  <meta name="description" content="Shop 11,000+ products: home decor, kitchen, beauty, gadgets, fashion and more. Free delivery and Cash on Delivery all over Pakistan.">
  <meta name="theme-color" content="#ff5a1f">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MyStore | Online Shopping in Pakistan">
  <meta property="og:description" content="11,000+ products with free delivery and Cash on Delivery all over Pakistan.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23ff5a1f'/><path d='M20 24h24l-2 24H22z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/><path d='M26 24v-3a6 6 0 0 1 12 0v3' fill='none' stroke='white' stroke-width='4'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="topbar"><div class="container topbar-row"><span id="announce"></span><a id="topWa" target="_blank" rel="noopener"></a></div></div>

  <header class="header" id="header">
    <div class="container header-row">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open categories"></button>
      <a href="#/" class="logo" id="logo"></a>
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <input type="search" id="searchInput" placeholder="Search 11,000+ products..." aria-label="Search products">
        <button type="submit" aria-label="Search" id="searchBtn"></button>
        <div class="suggest" id="suggest" hidden></div>
      </form>
      <nav class="header-actions">
        <a class="action wa-action" id="helpLink" target="_blank" rel="noopener"></a>
        <a href="#/cart" class="action cart-link" id="cartLink" aria-label="Cart"></a>
      </nav>
    </div>
    <nav class="catnav"><div class="container catnav-inner" id="catnav"></div></nav>
  </header>

  <main id="app">
    <div class="container"><div class="skeleton-grid" id="boot"></div></div>
  </main>

  <footer class="footer" id="footer"></footer>

  <nav class="bottom-nav" id="bottomNav"></nav>

  <div class="overlay" id="overlay" hidden></div>
  <aside class="drawer drawer-left" id="catDrawer" aria-label="Categories"></aside>
  <aside class="drawer drawer-right" id="cartDrawer" aria-label="Cart"></aside>

  <a class="wa-float" id="waFloat" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"></a>
  <button class="to-top" id="toTop" aria-label="Back to top"></button>
  <div class="toast" id="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
